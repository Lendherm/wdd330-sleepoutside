<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider checkout">
      <h2>Review &amp; Place your Order</h2>

      <section class="checkout-form">
        <form id="checkout-form" name="checkout">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">
              First Name
              <input
                type="text"
                id="fname"
                name="fname"
                required
                autocomplete="given-name"
              />
            </label>
            <label for="lname">
              Last Name
              <input
                type="text"
                id="lname"
                name="lname"
                required
                autocomplete="family-name"
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">
              Street Address
              <input
                type="text"
                id="street"
                name="street"
                required
                autocomplete="street-address"
              />
            </label>
            <label for="city">
              City
              <input
                type="text"
                id="city"
                name="city"
                required
                autocomplete="address-level2"
              />
            </label>
            <label for="state">
              State
              <input
                type="text"
                id="state"
                name="state"
                required
                pattern="[A-Za-z]{2}"
                maxlength="2"
                title="Use a 2-letter state code (e.g. ID)"
                autocomplete="address-level1"
              />
            </label>
            <label for="zip">
              Zip Code
              <input
                type="text"
                id="zip"
                name="zip"
                required
                pattern="\d{5}(-\d{4})?"
                title="Enter a 5-digit ZIP code"
                autocomplete="postal-code"
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">
              Credit Card Number
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                required
                pattern="\d{16}"
                maxlength="16"
                inputmode="numeric"
                title="Enter a 16-digit card number"
                autocomplete="cc-number"
                value="1234123412341234"
              />
            </label>
            <label for="expiration">
              Expiration Date
              <input
                type="text"
                id="expiration"
                name="expiration"
                placeholder="MM/YY"
                required
                pattern="(0[1-9]|1[0-2])\/\d{2}"
                title="Use MM/YY format"
                autocomplete="cc-exp"
                value="12/30"
              />
            </label>
            <label for="code">
              Security Code
              <input
                type="text"
                id="code"
                name="code"
                required
                pattern="\d{3,4}"
                maxlength="4"
                inputmode="numeric"
                title="Enter the 3 or 4 digit security code"
                autocomplete="cc-csc"
                value="123"
              />
            </label>
          </fieldset>

          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </section>

      <aside class="order-summary">
        <h3>Order Summary</h3>
        <p>Items: <span id="num-items">0</span></p>
        <p>Subtotal: <span id="cartTotal">$0.00</span></p>
        <p>Tax: <span id="tax">$0.00</span></p>
        <p>Shipping: <span id="shipping">$0.00</span></p>
        <p class="order-total">
          Order Total: <span id="orderTotal">$0.00</span>
        </p>
      </aside>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
